name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign and publish release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag and version metadata
        run: node scripts/check-version.mjs "$GITHUB_REF_NAME"

      - name: Test and package extension
        run: bash scripts/wsl-build.sh

      - name: Sign extension for self-distribution
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          api_key="${AMO_JWT_ISSUER//[[:space:]]/}"
          api_secret="${AMO_JWT_SECRET//[[:space:]]/}"
          npx --yes web-ext@10.5.0 sign \
            --source-dir dist \
            --artifacts-dir signed-artifacts \
            --channel unlisted \
            --api-key "$api_key" \
            --api-secret "$api_secret" \
            --timeout 900000 \
            --approval-timeout 900000

      - name: Locate signed extension
        id: signed
        run: |
          mapfile -t signed_xpis < <(find signed-artifacts -maxdepth 1 -type f -name '*.xpi')
          if [[ ${#signed_xpis[@]} -ne 1 ]]; then
            echo "Expected exactly one signed XPI, found ${#signed_xpis[@]}" >&2
            exit 1
          fi
          echo "path=${signed_xpis[0]}" >> "$GITHUB_OUTPUT"

      - name: Build GitHub Pages release site
        run: node scripts/build-site.mjs "${{ steps.signed.outputs.path }}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              pages/*.xpi pages/SHA256SUMS \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              pages/*.xpi pages/SHA256SUMS \
              --verify-tag \
              --generate-notes \
              --title "ICS to Google Calendar $GITHUB_REF_NAME"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
