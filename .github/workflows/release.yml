name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag and version metadata
        run: node scripts/check-version.mjs "$GITHUB_REF_NAME"

      - name: Test and package extension
        run: bash scripts/wsl-build.sh

      - name: Create checksums
        run: sha256sum artifacts/*.xpi > artifacts/SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              artifacts/*.xpi artifacts/SHA256SUMS \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              artifacts/*.xpi artifacts/SHA256SUMS \
              --verify-tag \
              --generate-notes \
              --title "ICS to Google Calendar $GITHUB_REF_NAME"
          fi
